<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desmos | Graphing Calculator</title> <!-- Fake title for safety -->
    <link id="favicon" rel="icon" type="image/x-icon" href="https://gstatic.com"> <!-- Classroom Tab Icon -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: #0d0e12; 
            color: #e2e8f0; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Centered Header Dashboard */
        .dashboard-header {
            width: 100%;
            max-width: 1000px;
            text-align: center;
            padding: 30px 20px;
            margin-top: 20px;
            background: #1a1c23;
            border-radius: 20px;
            border: 1px solid #00f2fe;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .dashboard-header h1 {
            color: #00f2fe;
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        .btn-cloak {
            background: #ff007f;
            color: white;
            border: none;
            padding: 10px 24px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
            transition: 0.2s;
        }
        .btn-cloak:hover { transform: scale(1.05); background: #ff3399; }

        /* Sleek Centered Search Bar */
        .search-container { width: 100%; display: flex; justify-content: center; }
        #searchBar {
            width: 90%;
            max-width: 500px;
            padding: 14px 25px;
            font-size: 1.1rem;
            border-radius: 30px;
            border: 2px solid #334155;
            background: #090a0f;
            color: white;
            outline: none;
            transition: 0.3s;
        }
        #searchBar:focus { border-color: #00f2fe; box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); }

        /* The Main Center Menu Grid */
        .menu-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 20px; 
            width: 100%;
            max-width: 1000px; 
            padding: 40px 20px;
        }

        /* Clean Clickable Game Cards */
        .game-card { 
            background: #1a1c23; 
            padding: 25px 15px; 
            border-radius: 16px; 
            text-align: center;
            border: 1px solid #2d3748;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .game-card:hover {
            transform: translateY(-5px);
            border-color: #00f2fe;
            box-shadow: 0 10px 20px rgba(0, 242, 254, 0.2);
            background: #222531;
        }
        .game-card .icon { font-size: 2.5rem; margin-bottom: 12px; display: inline-block; }
        .game-card h3 { color: #ffffff; font-size: 1.2rem; font-weight: 600; }

        /* Fullscreen Isolated Game Theater Mode */
        .player-container {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000000;
            z-index: 9999;
            flex-direction: column;
        }
        .player-bar {
            background: #1a1c23;
            height: 50px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 2px solid #00f2fe;
        }
        .player-title { color: #00f2fe; font-weight: bold; font-size: 1.1rem; }
        .btn-back {
            background: #334155;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-back:hover { background: #475569; }
        .game-frame { width: 100%; flex: 1; border: none; background: #000; }
    </style>
</head>
<body>

    <!-- CENTRED HUB OVERVIEW -->
    <div id="mainDashboard" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="dashboard-header">
            <h1>ARCADE PROTOCOL</h1>
            <button class="btn-cloak" onclick="cloakTab()">⚠️ EMERGENCY CLOAK TAB</button>
            <div class="search-container">
                <input type="text" id="searchBar" onkeyup="filterGames()" placeholder="Search available engines...">
            </div>
        </div>

        <!-- MAIN CENTRED MENU LINKS -->
        <div class="menu-grid" id="menuGrid">
            <div class="game-card" onclick="openGame('⛏️ Eaglercraft 1.12.2', 'https://eaglercraft.ir')">
                <span class="icon">⛏️</span><h3>Minecraft 1.12.2</h3>
            </div>
            <div class="game-card" onclick="openGame('🪂 Fortzone BR', 'https://gitlab.io')">
                <span class="icon">🪂</span><h3>Fortzone BR</h3>
            </div>
            <div class="game-card" onclick="openGame('👵 Granny Horror', 'https://gitlab.io')">
                <span class="icon">👵</span><h3>Granny Horror</h3>
            </div>
            <div class="game-card" onclick="openGame('🥔 Brotato', 'https://gitlab.io')">
                <span class="icon">🥔</span><h3>Brotato</h3>
            </div>
            <div class="game-card" onclick="openGame('🧠 Steal A Brainrot', 'https://gitlab.io')">
                <span class="icon">🧠</span><h3>Steal A Brainrot</h3>
            </div>
            <div class="game-card" onclick="openGame('🏎️ Drift Boss', 'https://github.io')">
                <span class="icon">🏎️</span><h3>Drift Boss</h3>
            </div>
            <div class="game-card" onclick="openGame('🧱 1v1.LOL', 'https://github.io')">
                <span class="icon">🧱</span><h3>1v1.LOL</h3>
            </div>
            <div class="game-card" onclick="openGame('🏈 Retro Bowl', 'https://github.io')">
                <span class="icon">🏈</span><h3>Retro Bowl</h3>
            </div>
            <div class="game-card" onclick="openGame('🟢 Slope 3D', 'https://github.io')">
                <span class="icon">🟢</span><h3>Slope 3D</h3>
            </div>
            <div class="game-card" onclick="openGame('🛹 Subway Surfers', 'https://github.io')">
                <span class="icon">🛹</span><h3>Subway Surfers</h3>
            </div>
        </div>
    </div>

    <!-- FULLSCREEN SYSTEM INTERFACE RUNTIME -->
    <div id="playerContainer" class="player-container">
        <div class="player-bar">
            <span id="playerTitle" class="player-title">Loading Protocol...</span>
            <button class="btn-back" onclick="closeGame()">↩️ CLOSE GAME</button>
        </div>
        <iframe id="gameFrame" class="game-frame" allow="fullscreen; autoplay; gamepad; microphone"></iframe>
    </div>

    <script>
        // Smooth Screen Transits
        function openGame(title, url) {
            document.getElementById("mainDashboard").style.display = "none";
            document.getElementById("playerContainer").style.display = "flex";
            document.getElementById("playerTitle").innerText = title;
            document.getElementById("gameFrame").src = url;
        }

        function closeGame() {
            document.getElementById("playerContainer").style.display = "none";
            document.getElementById("mainDashboard").style.display = "flex";
            document.getElementById("gameFrame").src = ""; // Stop loading overhead
        }

        // Tab Hide Execution
        function cloakTab() {
            document.title = "Google Classroom";
            document.getElementById("favicon").setAttribute("href", "https://gstatic.com");
            alert("Tab disguised as Google Classroom!");
        }

        // Grid Menu Search Algorithm
        function filterGames() {
            let input = document.getElementById('searchBar').value.toLowerCase();
            let cards = document.getElementsByClassName('game-card');
            for (let i = 0; i < cards.length; i++) {
                let text = cards[i].getElementsByTagName('h3')[0].innerText.toLowerCase();
                cards[i].style.display = text.includes(input) ? "" : "none";
            }
        }
    </script>
</body>
</html>
